<!DOCTYPE HTML>
<html>
<head>
  {% load static %}
  <meta charset="UTF-8">
  <title>NPPG Dashboard</title>
  <link rel="stylesheet" href="{% static 'nppg/css/dashboard.css' %}">
  <script src="https://cdn.canvasjs.com/canvasjs.min.js"></script>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/pretendard/dist/web/static/pretendard.css" />
  <style>
    .kpis { display: flex; align-items: center; gap: 12px; }
    .wear-popup--hidden { display: none !important; }
    .baseline-wrap { margin-top: 6px; width: 220px; }
    .baseline-bg   { background: #e5e7eb; border-radius: 6px; height: 8px; }
    .baseline-bar  { background: #6366f1; border-radius: 6px; height: 8px;
                     width: 0%; transition: width 0.5s linear; }
    .baseline-meta { font-size: 12px; color: #6b7280; margin-top: 3px; }
  </style>
</head>
<body>

<div id="appRoot">
  <header class="header">
    <h1>Apnea detection dashboard (NPPG) powered by Sungshin Women's University</h1>
    <img class="logo" src="{% static 'nppg/image/logo.png' %}" alt="logo" />
  </header>

  <section class="kpis">
    <div class="kpi">
      <div class="kpi-label">Last Device</div>
      <div id="kpiDevice" class="kpi-value">-</div>
    </div>

    <div class="kpi-right">
      <div class="kpi kpi-compact">
        <div class="kpi-label">
          <span class="kpi-title">Baseline (90s)</span>
          <!--
            기존 ppg의 PI/RMSSD 대신 90초 progress bar를 표시합니다.
            새 모델은 PI/RMSSD를 직접 노출하지 않기 때문입니다.
          -->
          <div class="baseline-wrap">
            <div class="baseline-bg">
              <div id="baselineBar" class="baseline-bar"></div>
            </div>
            <div id="baselineMeta" class="baseline-meta">측정 전</div>
          </div>
        </div>
      </div>
      <button id="btnStartNew" type="button" class="btn-inline">측정 시작</button>
    </div>
  </section>

  <section class="grid-split">

    <!-- 착용/미착용 카드 — 기존 ppg와 완전 동일 (조건 3) -->
    <div class="card grid-left">
      <div class="wear-card wear-card--split" id="wearCard">
        <div class="wear-card__top">
          <div class="wear-card__title">탈부착 여부</div>
          <div id="wearStatusText" class="wear-card__status">-</div>
          <div id="wearStatusMeta" class="wear-card__meta">대기 중 ...</div>
        </div>
        <div class="wear-card__bottom">
          <img id="wearStateImage" src="{% static 'nppg/image/wear_on.png' %}" alt="Wear status" />
        </div>
      </div>
    </div>

    <!--
      무호흡 감지 차트 — IR_HOLDING 키를 그대로 읽으므로
      기존 ppg charts.js와 동일한 DOM id를 사용합니다.
    -->
    <div class="card grid-right-top">
      <div id="irHoldingChart" class="chart-box"></div>
      <div id="irHoldingMeta" class="major" style="margin-top:8px;text-align:center;"></div>
      <div class="chart-legend">
        <span class="legend-box apnea"></span> Apnea
        <span class="legend-box invalid"></span> invalid
      </div>
    </div>

    <!-- R Ratio — 기존 ppg와 완전 동일 (조건 3) -->
    <div class="card grid-right-bottom">
      <div id="ppgRratio" class="chart-box"></div>
      <div id="ppgDecision" class="decision"></div>
    </div>

  </section>

  {{ items|json_script:"items-json" }}
  <script>
    window.ITEMS    = JSON.parse(document.getElementById('items-json').textContent || '[]');
    window.NPPG_API = '/nppg/api';
  </script>
  <!--
    JS는 기존 ppg static 파일을 그대로 사용합니다.
    API 경로만 window.NPPG_API로 오버라이드합니다.
  -->
  <script src="{% static 'nppg/js/state_n.js' %}"  type="module"></script>
  <script src="{% static 'nppg/js/api_n.js' %}"    type="module"></script>
  <script src="{% static 'nppg/js/popup_n.js' %}"  type="module"></script>
  <script src="{% static 'nppg/js/charts_n.js' %}" type="module"></script>
  <script src="{% static 'nppg/js/main_n.js' %}"   type="module"></script>
</div>

<!-- 베이스라인 팝업 — 90초로 변경 (조건 5) -->
<div id="wearPopup" class="wear-popup wear-popup--hidden" aria-hidden="true">
  <div class="wear-popup__inner">
    <div id="wp-text" class="wear-popup__text">대기 중</div>
    <div class="wear-popup__progress">
      <div id="wp-progressbar" class="wear-popup__bar" style="width:0%"></div>
    </div>
    <div class="wear-popup__counter">
      <span id="wp-seconds">0</span> / 90초
    </div>
  </div>
  <button id="wp-close" class="wear-popup__close" aria-label="닫기">×</button>
</div>
<div id="wearOverlay" class="wear-overlay"></div>

</body>
</html>
